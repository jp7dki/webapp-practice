<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="現在時刻をニキシー管風に大きく表示する時計ページ">
  <title>ニキシー管時計</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock">
    <p id="date" class="clock__date">----年--月--日（-）</p>

    <!-- 時:分:秒 の6桁。各管の中身（0〜9の陰極）は script.js で生成する -->
    <div class="panel" aria-hidden="true">
      <div class="pair">
        <div class="tube" data-digit="0"></div>
        <div class="tube" data-digit="1"></div>
      </div>
      <div class="sep"><i></i><i></i></div>
      <div class="pair">
        <div class="tube" data-digit="2"></div>
        <div class="tube" data-digit="3"></div>
      </div>
      <div class="sep"><i></i><i></i></div>
      <div class="pair">
        <div class="tube" data-digit="4"></div>
        <div class="tube" data-digit="5"></div>
      </div>
    </div>

    <!-- 読み上げ用のテキスト表示 -->
    <time id="time" class="visually-hidden">--:--:--</time>
  </main>
  <script src="script.js"></script>
</body>
</html>
