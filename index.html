<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="現在時刻を大きく表示するシンプルな時計ページ">
  <title>現在時刻</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="clock" aria-live="polite">
    <p id="date" class="clock__date">----年--月--日（-）</p>
    <p id="time" class="clock__time">--:--:--</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
